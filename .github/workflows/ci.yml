name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  pull_request:
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  workflow_dispatch:
  schedule: 
    - cron: "0 1 1 * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1
  nightly: nightly
  stable: stable

jobs:
  version:
    name: version
    needs: prepare-locks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cargo-lockfiles
          path: .
      - name: Verify lock artifacts
        run: scripts/verify-lock-artifacts.sh --fixture
      - name: Verify release metadata
        run: python3 scripts/check-release-version.py

  prepare-locks:
    name: Prepare generated lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@1.120.0
      - name: Enforce lockfile policy
        run: scripts/check-lockfile-policy.sh
      - name: Generate root and fixture lockfiles
        run: scripts/generate-lockfiles.sh --rust-1.85 --fixture
      - name: Verify lock provenance
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python3 scripts/check-release-lock.py --release --expected-version "${GITHUB_REF_NAME#v}"
          else
            python3 scripts/check-release-lock.py
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: cargo-lockfiles
          path: |
            Cargo.lock
            tests/fixtures/custom-address/Cargo.lock
          if-no-files-found: error

  # Check formatting
  rustfmt:
    name: rustfmt
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Check formatting
      run: cargo fmt --all -- --check


  # Apply clippy lints
  clippy:
    name: clippy
    needs: prepare-locks
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: cargo-lockfiles
        path: .
    - name: Verify lock artifacts
      shell: bash
      run: scripts/verify-lock-artifacts.sh --fixture
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Apply clippy lints
      run: cargo hack clippy --locked --each-feature --all-targets -- -D warnings

  # Run tests on some extra platforms
  cross:
    name: cross
    needs: prepare-locks
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-linux-android
          - aarch64-unknown-linux-musl
          - i686-linux-android
          - x86_64-linux-android
          - i686-pc-windows-gnu
          - x86_64-pc-windows-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          # - mips64-unknown-linux-gnuabi64
          - riscv64gc-unknown-linux-gnu
          - wasm32-unknown-unknown
          - wasm32-unknown-emscripten
          - wasm32-wasip1
          - wasm32-wasip1-threads
          - wasm32-wasip2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cargo-lockfiles
          path: .
      - name: Verify lock artifacts
        shell: bash
        run: scripts/verify-lock-artifacts.sh --fixture
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cross-
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: cargo build --target ${{ matrix.target }}
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --locked --target ${{ matrix.target }}

  build:
    name: build
    needs: prepare-locks
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: cargo-lockfiles
        path: .
    - name: Verify lock artifacts
      shell: bash
      run: scripts/verify-lock-artifacts.sh --fixture
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-build-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Cache ~/.cargo
      uses: actions/cache@v6
      with:
        path: ~/.cargo
        key: ${{ runner.os }}-coverage-dotcargo
    - name: Run build
      run: cargo hack build --locked --each-feature
  
  test:
    name: test
    needs: prepare-locks
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: cargo-lockfiles
        path: .
    - name: Verify lock artifacts
      shell: bash
      run: scripts/verify-lock-artifacts.sh --fixture
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-test-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Cache ~/.cargo
      uses: actions/cache@v6
      with:
        path: ~/.cargo
        key: ${{ runner.os }}-coverage-dotcargo
    - name: Run test
      run: cargo hack test --locked --each-feature

  msrv:
    name: msrv
    needs: prepare-locks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cargo-lockfiles
          path: .
      - name: Verify lock artifacts
        shell: bash
        run: scripts/verify-lock-artifacts.sh --fixture
      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check without default features
        run: cargo +1.85.0 check -p hardware-address --locked --no-default-features
      - name: Check all features
        run: cargo +1.85.0 check -p hardware-address --locked --all-features

  no_std:
    name: no_std
    needs: prepare-locks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cargo-lockfiles
          path: .
      - name: Verify lock artifacts
        shell: bash
        run: scripts/verify-lock-artifacts.sh --fixture
      - name: Install Rust 1.85.0 and target
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup target add thumbv6m-none-eabi --toolchain 1.85.0
      - name: Check without default features
        run: cargo +1.85.0 check -p hardware-address --locked --target thumbv6m-none-eabi --no-default-features
      - name: Check alloc
        run: cargo +1.85.0 check -p hardware-address --locked --target thumbv6m-none-eabi --no-default-features --features alloc
      - name: Check serde
        run: cargo +1.85.0 check -p hardware-address --locked --target thumbv6m-none-eabi --no-default-features --features serde

  public-macro:
    name: public-macro
    needs: prepare-locks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cargo-lockfiles
          path: .
      - name: Verify lock artifacts
        shell: bash
        run: scripts/verify-lock-artifacts.sh --fixture
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Check without default features
        run: cargo check --manifest-path tests/fixtures/custom-address/Cargo.toml --locked --no-default-features
      - name: Check wasm-bindgen custom type
        run: cargo check --manifest-path tests/fixtures/custom-address/Cargo.toml --locked --target wasm32-unknown-unknown --no-default-features --features std,wasm-bindgen
      - name: Test default features
        run: cargo test --manifest-path tests/fixtures/custom-address/Cargo.toml --locked
      - name: Check all features
        run: cargo check --manifest-path tests/fixtures/custom-address/Cargo.toml --locked --all-features
      - name: Test all features
        run: cargo test --manifest-path tests/fixtures/custom-address/Cargo.toml --locked --all-features

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs:
      - rustfmt
      - clippy
      - build
      - cross
      - test
      - msrv
      - no_std
      - public-macro
      - version
      - prepare-locks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cargo-lockfiles
          path: .
      - name: Verify lock artifacts
        shell: bash
        run: scripts/verify-lock-artifacts.sh --fixture
      - name: Install Rust
        run: rustup update nightly && rustup default nightly
      - name: Install cargo-llvm-cov
        # Pin cargo-llvm-cov so CI and local runs use the same coverage
        # tooling and produce deterministic reports.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Cache cargo registry
        # Intentionally do NOT cache `target/`. Instrumented coverage
        # artifacts should not be reused across runs because stale profile
        # data can distort coverage results.
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-coverage-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-coverage-registry-
      - name: Print rustc / cargo-llvm-cov versions
        run: |
          rustc --version
          cargo llvm-cov --version
      - name: Run cargo-llvm-cov
        # `--exclude python --exclude wasm`: binding behavior is covered
        # by the Python pytest and WASM test jobs, so this root coverage
        # report only measures the Rust library and avoids double-counting
        # the binding packages.
        run: cargo llvm-cov --locked --workspace --exclude python --exclude wasm --features serde,arbitrary,quickcheck,proptest --doctests --lcov --output-path lcov.info
      - name: Upload coverage report artifact
        # Lets us download the exact lcov.info cargo-llvm-cov produced and
        # diff it locally against a local coverage run — useful when
        # codecov's reported number and local runs disagree.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lcov-info
          path: lcov.info
          if-no-files-found: warn
          retention-days: 14
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          fail_ci_if_error: true
