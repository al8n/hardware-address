name: Python

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Verify release metadata
    needs: prepare-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cargo-lock
          path: .
      - name: Verify lock artifact
        run: scripts/verify-lock-artifacts.sh
      - run: python3 scripts/check-release-version.py

  prepare-lock:
    name: Prepare Cargo.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@1.85.0
      - name: Enforce lockfile policy
        run: scripts/check-lockfile-policy.sh
      - name: Generate lockfile
        run: scripts/generate-lockfiles.sh --rust-1.85
      - name: Verify lock provenance
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python3 scripts/check-release-lock.py --release --expected-version "${GITHUB_REF_NAME#v}"
          else
            python3 scripts/check-release-lock.py
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: error

  test:
    name: Test Python Package (CPython ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [version, prepare-lock]
    strategy:
      matrix:
        python-version: ['3.8', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cargo-lock
          path: .
      - name: Verify lock artifact
        run: scripts/verify-lock-artifacts.sh
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build and test
        working-directory: python
        run: |
          chmod +x test.sh
          ./test.sh

  linux:
    runs-on: ${{ matrix.platform.runner }}
    needs: [version, prepare-lock]
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
          - runner: ubuntu-22.04
            target: s390x
          - runner: ubuntu-22.04
            target: ppc64le
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cargo-lock
          path: .
      - name: Verify lock artifact
        run: scripts/verify-lock-artifacts.sh
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
          working-directory: python
      - name: Verify wheel licenses
        run: python scripts/check-python-artifacts.py python/dist/*.whl
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: python/dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    needs: [version, prepare-lock]
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cargo-lock
          path: .
      - name: Verify lock artifact
        run: scripts/verify-lock-artifacts.sh
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
          working-directory: python
      - name: Verify wheel licenses
        run: python scripts/check-python-artifacts.py python/dist/*.whl
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: python/dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    needs: [version, prepare-lock]
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cargo-lock
          path: .
      - name: Verify lock artifact
        run: scripts/verify-lock-artifacts.sh
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          working-directory: python
      - name: Verify wheel licenses
        run: python scripts/check-python-artifacts.py python/dist/*.whl
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: python/dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    needs: [version, prepare-lock]
    strategy:
      matrix:
        platform:
          - runner: macos-14
            target: aarch64
          - runner: macos-15-intel
            target: x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cargo-lock
          path: .
      - name: Verify lock artifact
        run: scripts/verify-lock-artifacts.sh
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          working-directory: python
      - name: Verify wheel licenses
        run: python scripts/check-python-artifacts.py python/dist/*.whl
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: python/dist

  sdist:
    runs-on: ubuntu-latest
    needs: [version, prepare-lock]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cargo-lock
          path: .
      - name: Verify lock artifact
        run: scripts/verify-lock-artifacts.sh
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install maturin
        run: python -m pip install maturin==1.9.6
      - name: Build sdist
        working-directory: python
        run: python -m maturin sdist --manifest-path Cargo.toml --out dist
      - name: Verify sdist and release metadata
        shell: bash
        run: |
          python3 scripts/check-release-version.py
          archive="$(printf '%s\n' python/dist/*.tar.gz)"
          test -s "$archive"
          python3 scripts/check-python-artifacts.py "$archive"
          smoke_root="${RUNNER_TEMP}/hardware-address-sdist"
          wheel_dir="${RUNNER_TEMP}/hardware-address-sdist-wheel"
          venv_dir="${RUNNER_TEMP}/hardware-address-sdist-venv"
          target_dir="${RUNNER_TEMP}/hardware-address-sdist-target"
          rm -rf "$smoke_root" "$wheel_dir" "$venv_dir" "$target_dir"
          mkdir -p "$smoke_root" "$wheel_dir"
          top_levels="$(tar -tzf "$archive" | awk -F/ 'NF {print $1}' | sort -u)"
          test "$(printf '%s\n' "$top_levels" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 1
          tar -xzf "$archive" --strip-components=1 -C "$smoke_root"
          test -f "$smoke_root/Cargo.toml"
          test -f "$smoke_root/Cargo.lock"
          test -f "$smoke_root/src/lib.rs"
          test -f "$smoke_root/python/Cargo.toml"
          test -f "$smoke_root/python/src/lib.rs"
          test -f "$smoke_root/pyproject.toml"
          (
            cd "$smoke_root"
            CARGO_TARGET_DIR="$target_dir" python -m maturin build --release --locked --out "$wheel_dir"
          )
          python3 scripts/check-python-artifacts.py "$wheel_dir"/*.whl
          python -m venv "$venv_dir"
          "$venv_dir/bin/pip" install "$wheel_dir"/*.whl
          "$venv_dir/bin/python" -c 'from hardware_address import MacAddr; assert str(MacAddr.parse("00:00:5e:00:53:01")) == "00:00:5e:00:53:01"'
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: python/dist

  release:
    name: Release
    runs-on: ubuntu-latest
    environment: pypi
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [version, prepare-lock, test, linux, musllinux, windows, macos, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cargo-lock
          path: .
      - name: Verify lock artifact
        run: scripts/verify-lock-artifacts.sh

      - name: Verify release version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python3 scripts/check-release-version.py "${GITHUB_REF_NAME#v}"
          else
            python3 scripts/check-release-version.py
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -R dist/

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'

      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
