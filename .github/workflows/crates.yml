name: Crates.io

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-lock:
    name: Prepare Cargo.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@1.85.0
      - name: Enforce lockfile policy
        run: scripts/check-lockfile-policy.sh
      - name: Generate lockfile
        run: scripts/generate-lockfiles.sh --rust-1.85
      - name: Verify lock provenance
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python3 scripts/check-release-lock.py --release --expected-version "${GITHUB_REF_NAME#v}"
          else
            python3 scripts/check-release-lock.py
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: error

  verify:
    name: Verify crate release
    needs: prepare-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cargo-lock
          path: .
      - name: Verify lock artifact
        run: scripts/verify-lock-artifacts.sh
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify release version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python3 scripts/check-release-version.py "${GITHUB_REF_NAME#v}"
          else
            python3 scripts/check-release-version.py
          fi
      - name: Run prepublish checks
        run: |
          cargo test -p hardware-address --locked --all-features
          cargo package -p hardware-address --locked
          cargo publish -p hardware-address --locked --dry-run

  stage-release-lock:
    name: Stage release lock assets
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [prepare-lock, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cargo-lock
          path: .
      - name: Verify lock artifact
        run: scripts/verify-lock-artifacts.sh
      - name: Verify and stage draft assets
        run: scripts/stage-release-lock.sh "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    name: Publish crate
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [verify, stage-release-lock]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cargo-lock
          path: .
      - name: Verify lock artifact
        run: scripts/verify-lock-artifacts.sh
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify release provenance
        run: |
          python3 scripts/check-release-version.py "${GITHUB_REF_NAME#v}"
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish hardware-address
        run: cargo publish -p hardware-address --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
