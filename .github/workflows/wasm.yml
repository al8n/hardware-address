name: WASM

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Verify release metadata
    needs: prepare-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cargo-lock
          path: .
      - name: Verify lock artifact
        run: scripts/verify-lock-artifacts.sh
      - run: python3 scripts/check-release-version.py

  prepare-lock:
    name: Prepare Cargo.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@1.120.0
      - name: Enforce lockfile policy
        run: scripts/check-lockfile-policy.sh
      - name: Generate lockfile
        run: scripts/generate-lockfiles.sh --rust-1.85
      - name: Verify lock provenance
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python3 scripts/check-release-lock.py --release --expected-version "${GITHUB_REF_NAME#v}"
          else
            python3 scripts/check-release-lock.py
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: error

  test:
    name: Test WASM Package (Node ${{ matrix.node }})
    needs: [version, prepare-lock]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cargo-lock
          path: .
      - name: Verify lock artifact
        run: scripts/verify-lock-artifacts.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: Build and test dual package
        working-directory: wasm
        run: |
          chmod +x test-dual.sh
          ./test-dual.sh

      - name: Verify npm package
        working-directory: wasm/pkg-dual
        run: npm pack --dry-run

      - name: Upload tested npm package artifact
        if: ${{ matrix.node == 24 }}
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: wasm/pkg-dual

  build-targets:
    name: Build WASM for Different Targets
    needs: [version, prepare-lock]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [bundler, nodejs, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cargo-lock
          path: .
      - name: Verify lock artifact
        run: scripts/verify-lock-artifacts.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: Build for ${{ matrix.target }}
        working-directory: wasm
        # `--out-name hardware_address` keeps the npm-side filenames
        # stable regardless of the crate's `[lib] name`, which is set
        # to `wasm_hardware_address` so rustdoc's workspace doctest
        # build doesn't collide with the root `hardware_address` rlib.
        run: wasm-pack build --target ${{ matrix.target }} --release --out-dir pkg-${{ matrix.target }} --out-name hardware_address -- --locked

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-${{ matrix.target }}
          path: wasm/pkg-${{ matrix.target }}

  release:
    name: Release to npm
    runs-on: ubuntu-latest
    environment: npm
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [version, prepare-lock, test, build-targets]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cargo-lock
          path: .
      - name: Verify lock artifact
        run: scripts/verify-lock-artifacts.sh

      - name: Verify release version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python3 scripts/check-release-version.py "${GITHUB_REF_NAME#v}"
          else
            python3 scripts/check-release-version.py
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Pin npm
        run: npm install --global npm@11.15.0

      - name: Download tested npm package artifact
        uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: wasm/pkg-dual

      - name: Verify tested package metadata
        run: |
          source_version="$(node -p "require('./wasm/package.json').version")"
          package_version="$(node -p "require('./wasm/pkg-dual/package.json').version")"
          test "$package_version" = "$source_version"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$package_version" = "${GITHUB_REF_NAME#v}"
          fi

      - name: Publish to npm
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        working-directory: wasm/pkg-dual
        run: |
          if [[ "$(node -p "require('./package.json').version")" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: npm-release-package
          path: wasm/pkg-dual
